# Free API hosting on Render + free Postgres on Neon.
services:
  - type: web
    name: bagzine-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-api-deploy.txt
    startCommand: PYTHONPATH=/opt/render/project/src uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        sync: false
